syntax = "proto3";

package user.v1;
option go_package = "github.com/thawthuhan/api-gateway-lab/auth-service/proto/user/v1;userv1";

service UserService {
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserByEmailResponse) {}
}

message User {
    int64 id = 1;
    string username = 2;
    string email = 3;
    string password = 4;
}

message GetUserByEmailRequest {
    string email = 1;
}

message GetUserByEmailResponse {
    User user = 1;
}